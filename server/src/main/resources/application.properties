spring.application.name=coderoom

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coder_editor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Email (Resend API) ────────────────────────────────────────────────────────
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:CodeRoom <onboarding@resend.dev>}

# ── AI (Gemini) ───────────────────────────────────────────────────────────────
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# ── WebSocket ─────────────────────────────────────────────────────────────────
# Allowed WS origins (same as CORS origins for dev)
ws.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.dev.manoj=INFO
logging.level.org.springframework.web.socket=INFO

